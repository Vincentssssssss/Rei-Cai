<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>贪吃蛇小游戏</title>
    <link rel="stylesheet" href="./snake.css" />
  </head>
  <body>
    <main class="game-page">
      <h1>贪吃蛇</h1>
      <section class="scoreboard" aria-label="游戏分数">
        <p>分数：<span id="score">0</span></p>
        <p>最高分：<span id="high-score">0</span></p>
      </section>
      <canvas
        id="game-canvas"
        width="400"
        height="400"
        aria-label="贪吃蛇游戏画布"
      ></canvas>
      <p class="hint">方向键 / WASD 控制移动，Game Over 后按空格重开</p>
    </main>
    <script src="./snake.js" defer></script>
  </body>
</html>
