services:
  backend:
    build:
      context: ./backend
    container_name: ppt-translator-backend
    environment:
      - PYTHONUNBUFFERED=1
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
    container_name: ppt-translator-frontend
    environment:
      - NEXT_PUBLIC_BACKEND_URL=http://localhost:8000
    depends_on:
      - backend
    ports:
      - "3000:3000"
